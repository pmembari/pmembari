<linearGradient id="sheen"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="100%" rx="26" fill="#07091b"/>
<rect x="2" y="2" width="1196" height="256" rx="24" fill="none" stroke="url(#g)" stroke-width="2"/>
<rect width="1200" height="100%" rx="26" fill="url(#g)" opacity=".12"/>
<rect width="1200" height="100%" rx="26" fill="url(#grid)"/>
<rect width="1200" height="100%" rx="26" fill="url(#orb)"/>
<g opacity=".42" stroke="url(#g)" fill="none">
<circle cx="1040" cy="130" r="82"><animate attributeName="r" values="72;96;72" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="1040" cy="130" r="120" stroke-dasharray="8 12"><animateTransform attributeName="transform" type="rotate" from="0 1040 130" to="360 1040 130" dur="20s" repeatCount="indefinite"/></circle>
<path d="M80 205 C300 120 530 220 820 70" stroke-dasharray="5 13"><animate attributeName="stroke-dashoffset" values="0;-180" dur="8s" repeatCount="indefinite"/></path>
