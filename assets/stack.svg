<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="03 / TECHNOLOGY MATRIX">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#67e8f9"><animate attributeName="stop-color" values="#67e8f9;#a78bfa;#f472b6;#6ee7b7;#67e8f9" dur="12s" repeatCount="indefinite"/></stop>
<stop offset=".5" stop-color="#a78bfa"><animate attributeName="stop-color" values="#a78bfa;#f472b6;#fcd34d;#67e8f9;#a78bfa" dur="12s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#67e8f9;#6ee7b7;#a78bfa;#f472b6" dur="12s" repeatCount="indefinite"/></stop>
</linearGradient>
<radialGradient id="orb"><stop stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animate attributeName="cx" values=".15;.8;.4;.15" dur="8s" repeatCount="indefinite"/><animate attributeName="cy" values=".2;.7;.35;.2" dur="9s" repeatCount="indefinite"/></radialGradient>
