<defs><linearGradient id="g"><stop stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#a78bfa;#f472b6;#f472b6" dur="10s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#f472b6"/></linearGradient><radialGradient id="o"><stop stop-color="#f472b6" stop-opacity=".3"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/><animate attributeName="cx" values=".1;.9;.1" dur="7s" repeatCount="indefinite"/></radialGradient><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern></defs>
